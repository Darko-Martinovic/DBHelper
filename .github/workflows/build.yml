name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: SQL Server ${{ matrix.sql-server }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sql-server: ["2022", "2025"]
    env:
      # The tests start this SQL Server in a container with Testcontainers
      MSSQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sql-server }}-latest
      # and restore AdventureWorks into it, from a backup they download once
      ADVENTUREWORKS_CACHE: ${{ github.workspace }}/.adventureworks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: .adventureworks
          key: adventureworks2017
      - run: dotnet build DBHelper.slnx
      - run: dotnet test --solution DBHelper.slnx --no-build
